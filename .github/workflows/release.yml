name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Windows archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $binary = Join-Path $output 'cortex.exe'
          go build -ldflags "-X main.version=$env:RELEASE_VERSION" -o $binary ./cmd/cortex
          $archive = Join-Path $PWD "cortex-$env:RELEASE_VERSION-windows-amd64.zip"
          Compress-Archive -Path $binary -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cortex-${{ github.ref_name }}-windows-amd64.zip
            cortex-${{ github.ref_name }}-windows-amd64.zip.sha256